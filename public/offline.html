<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Ultimate Tools offline</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef0f4;color:#08090c;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
      main{max-width:520px;padding:24px;text-align:center}
      h1{font-size:28px;line-height:1.1;margin:0 0 12px}
      p{margin:0;color:#4b5563;line-height:1.6}
      nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
      a{display:inline-flex;min-height:44px;align-items:center;border:1px solid #c9ced8;border-radius:999px;padding:0 18px;color:#08090c;text-decoration:none;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <h1>Offline mode</h1>
      <p>Pages opened on this device may still be available. Reconnect to load anything that has not been cached yet.</p>
      <nav aria-label="Cached pages">
        <a href="/ru">Home</a>
        <a href="/ru/tools/color-picker">Color</a>
        <a href="/ru/tools/password-generator">Passwords</a>
        <a href="/ru/tools/json-formatter">JSON</a>
        <a href="/ru/tools/qr-code-gen">QR</a>
        <a href="/ru/tools/pdf-studio">PDF</a>
      </nav>
    </main>
  </body>
</html>
